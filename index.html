<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ───────────────── HEADER: Greeting + Clock ───────────────── -->
    <header class="header">
      <div class="greeting-block">
        <p id="greeting" class="greeting">Good morning!</p>
        <h1 id="clock" class="clock">00:00:00</h1>
        <p id="date-display" class="date-display">Loading…</p>
      </div>
    </header>

    <!-- ───────────────── MAIN GRID ───────────────── -->
    <main class="dashboard">

      <!-- ── Focus Timer ── -->
      <section class="card" id="timer-card">
        <h2 class="card-title">⏱ Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button class="btn btn-primary" id="btn-start">Start</button>
          <button class="btn btn-secondary" id="btn-stop">Stop</button>
          <button class="btn btn-ghost" id="btn-reset">Reset</button>
        </div>
        <p class="timer-label" id="timer-label">Ready to focus?</p>
      </section>

      <!-- ── To-Do List ── -->
      <section class="card" id="todo-card">
        <h2 class="card-title">✅ To-Do List</h2>

        <div class="todo-input-row">
          <input
            type="text"
            id="todo-input"
            class="input"
            placeholder="Add a new task…"
            maxlength="120"
          />
          <button class="btn btn-primary" id="btn-add-todo">Add</button>
        </div>

        <ul class="todo-list" id="todo-list">
          <!-- tasks rendered by JS -->
        </ul>

        <p class="todo-empty" id="todo-empty">No tasks yet. Add one above!</p>
      </section>

      <!-- ── Quick Links ── -->
      <section class="card" id="links-card">
        <h2 class="card-title">🔗 Quick Links</h2>

        <div class="link-input-group">
          <input
            type="text"
            id="link-name-input"
            class="input"
            placeholder="Label (e.g. GitHub)"
            maxlength="40"
          />
          <input
            type="url"
            id="link-url-input"
            class="input"
            placeholder="https://example.com"
          />
          <button class="btn btn-primary" id="btn-add-link">Add Link</button>
        </div>

        <div class="links-grid" id="links-grid">
          <!-- links rendered by JS -->
        </div>

        <p class="todo-empty" id="links-empty">No links yet. Add one above!</p>
      </section>

    </main>

    <!-- ── Edit Task Modal ── -->
    <div class="modal-overlay" id="edit-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-labelledby="modal-title">
        <h3 id="modal-title">Edit Task</h3>
        <input
          type="text"
          id="edit-input"
          class="input"
          maxlength="120"
          placeholder="Update task text…"
        />
        <div class="modal-actions">
          <button class="btn btn-primary" id="btn-save-edit">Save</button>
          <button class="btn btn-ghost" id="btn-cancel-edit">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
